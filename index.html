<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mobile Workstation - Smart Magnet Snapping</title>
  <style>
    :root {
      --panel-bg: #2b2d32;
      --accent-gold: #d4af37;
      --led-red: #ff3b30;
      --led-yellow: #ffcc00;
      --screen-text: #33ff55;
      --track-height: 95px;
      --controls-width: 140px;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, monospace;
      background: #0f0f11;
      color: #e1e1e6;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    .header-panel {
      background: #1a1c20;
      border-bottom: 2px solid #000;
      padding: 8px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
    }
    .display-screen {
      background: #0d130e;
      color: var(--screen-text);
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      text-align: center;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid #222;
    }
    .rack-btn {
      background: #3a3d45;
      color: #fff;
      border: 1px solid #111;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.75rem;
      touch-action: manipulation;
    }
    .rack-btn.accent { background: #841515; }
    .rack-btn.active-snap {
      background: var(--accent-gold);
      color: #000;
    }

    select {
      background: #111; color: var(--accent-gold);
      border: 1px solid #444; padding: 4px; font-size: 0.75rem;
    }

    .workspace {
      flex: 1;
      overflow: auto;
      position: relative;
      background: #141518;
      -webkit-overflow-scrolling: touch;
    }

    .ruler-wrapper {
      position: sticky;
      top: 0;
      left: var(--controls-width);
      z-index: 20;
      height: 20px;
      background: #111;
      border-bottom: 1px solid #333;
      width: max-content;
    }
    .ruler-container { position: relative; height: 100%; }
    .ruler-mark {
      position: absolute; top: 0; bottom: 0;
      border-left: 1px solid #555; font-size: 10px; color: #aaa; padding-left: 2px;
    }

    /* Guía visual del imán */
    .snap-guide {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--accent-gold);
      box-shadow: 0 0 8px var(--accent-gold);
      z-index: 100;
      display: none;
      pointer-events: none;
    }

    .track-strip {
      display: flex;
      width: max-content;
      border-bottom: 2px solid #000;
    }

    .track-controls {
      width: var(--controls-width);
      height: var(--track-height);
      position: sticky;
      left: 0;
      z-index: 10;
      background: var(--panel-bg);
      border-right: 2px solid #000;
      padding: 6px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    .file-input-btn {
      background: #444;
      color: #fff;
      border: 1px solid #111;
      padding: 4px;
      font-size: 0.65rem;
      border-radius: 3px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
    }
    .file-input-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }

    .btn-led-group { display: flex; gap: 4px; }
    .led-btn {
      flex: 1; padding: 4px 0; font-size: 0.65rem; background: #222; color: #888; border: 1px solid #000;
    }
    .led-btn.active-mute { background: var(--led-red); color: #fff; }
    .led-btn.active-solo { background: var(--led-yellow); color: #000; }

    .slider-row {
      display: flex; justify-content: space-between; align-items: center; font-size: 0.6rem;
    }
    input[type="range"] { width: 75px; }

    .track-timeline {
      position: relative;
      height: var(--track-height);
      background: #0a0a0c;
    }
    .drop-zone-text {
      position: absolute; top: 15px; left: 10px; right: 10px;
      font-size: 0.7rem; color: #888; pointer-events: none;
      word-break: break-all;
    }

    .audio-clip {
      position: absolute;
      top: 5px;
      height: 85px;
      background: linear-gradient(180deg, #2b580c 0%, #639a67 100%);
      border: 1px solid #a8df8e;
      border-radius: 4px;
      color: #fff;
      font-size: 0.7rem;
      padding: 4px;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
      touch-action: none;
      z-index: 5;
    }
    .audio-clip.snapped {
      border-color: var(--accent-gold);
      box-shadow: 0 0 6px rgba(212, 175, 55, 0.6);
    }

    .remove-btn {
      position: absolute; right: 2px; top: 2px; background: rgba(0,0,0,0.6);
      border: none; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; z-index: 10;
    }
  </style>
  <script src="https://unpkg.com/wavefile"></script>
</head>
<body>

<div class="header-panel">
  <div class="header-row">
    <button class="rack-btn" id="addTrackBtn">+ Pista</button>
    <button class="rack-btn active-snap" id="snapToggleBtn">🧲 SNAP ON</button>
    <div class="display-screen" id="statusDisplay">SISTEMA LISTO</div>
    <button class="rack-btn" id="playBtn">▶ / ❚❚</button>
  </div>
  <div class="header-row">
    <select id="sampleRateSelect">
      <option value="48000">48kHz</option>
      <option value="44100">44.1kHz</option>
    </select>
    <select id="bitDepthSelect">
      <option value="16">16-Bit</option>
      <option value="24">24-Bit</option>
    </select>
    <button class="rack-btn accent" id="exportBtn">Exportar</button>
  </div>
</div>

<div class="workspace" id="workspace">
  <!-- Línea guía vertical para cuando se activa el imán -->
  <div class="snap-guide" id="snapGuide"></div>

  <div class="ruler-wrapper">
    <div class="ruler-container" id="ruler"></div>
  </div>
  <div id="trackContainer"></div>
</div>

<script>
  const MAX_MINUTES = 80;
  const MAX_DURATION_SEC = MAX_MINUTES * 60;
  const PIXELS_PER_SECOND = 1.5; 
  const TIMELINE_WIDTH = MAX_DURATION_SEC * PIXELS_PER_SECOND;
  const SNAP_THRESHOLD_PX = 15; // Distancia en píxeles para activar la atracción del imán

  let audioCtx = null;
  let tracks = [];
  let isPlaying = false;
  let activeSources = [];
  let isSnapEnabled = true;

  const ruler = document.getElementById('ruler');
  const snapGuide = document.getElementById('snapGuide');
  const snapToggleBtn = document.getElementById('snapToggleBtn');

  ruler.style.width = `${TIMELINE_WIDTH}px`;
  for (let min = 0; min <= MAX_MINUTES; min += 1) {
    const mark = document.createElement('div');
    mark.className = 'ruler-mark';
    mark.style.left = `${(min * 60) * PIXELS_PER_SECOND}px`;
    if (min % 5 === 0) mark.innerText = `${min}m`;
    ruler.appendChild(mark);
  }

  // Toggle del Imán
  snapToggleBtn.addEventListener('click', () => {
    isSnapEnabled = !isSnapEnabled;
    snapToggleBtn.classList.toggle('active-snap', isSnapEnabled);
    snapToggleBtn.innerText = isSnapEnabled ? "🧲 SNAP ON" : "🧲 SNAP OFF";
  });

  function getAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  document.body.addEventListener('touchstart', getAudioContext, { once: true });
  document.body.addEventListener('click', getAudioContext, { once: true });

  document.getElementById('addTrackBtn').addEventListener('click', addTrack);
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('exportBtn').addEventListener('click', exportWav);

  addTrack();

  function addTrack() {
    const trackId = Date.now();
    const trackDiv = document.createElement('div');
    trackDiv.className = 'track-strip';
    trackDiv.id = `track-${trackId}`;

    trackDiv.innerHTML = `
      <div class="track-controls">
        <div style="color:var(--accent-gold); font-size:0.75rem; font-weight:bold; text-align:center;">
          CH ${tracks.length + 1}
        </div>
        
        <div class="file-input-wrapper">
          <div class="file-input-btn">📂 Cargar Audio</div>
          <input type="file" 
                 accept="audio/*, .mp3, .wav, .flac, .m4a, .aac, .ogg, .alac, .aiff, .caf, .opus" 
                 class="file-input">
        </div>
        
        <div class="btn-led-group">
          <button class="led-btn mute-btn">M</button>
          <button class="led-btn solo-btn">S</button>
        </div>
        <div class="slider-row">
          <span>V</span>
          <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="1">
        </div>
        <div class="slider-row">
          <span>P</span>
          <input type="range" class="pan-slider" min="-1" max="1" step="0.01" value="0">
        </div>
      </div>

      <div class="track-timeline" id="timeline-${trackId}" style="width: ${TIMELINE_WIDTH}px;">
        <span class="drop-zone-text" id="status-${trackId}">Selecciona un audio</span>
      </div>
    `;

    document.getElementById('trackContainer').appendChild(trackDiv);

    const trackObj = {
      id: trackId, buffer: null, gainNode: null, panNode: null, 
      volume: 1, pan: 0, startTime: 0, isMuted: false, isSolo: false
    };
    tracks.push(trackObj);

    const fileInput = trackDiv.querySelector('.file-input');
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        processAudioFile(e.target.files[0], trackObj);
      }
    });

    trackDiv.querySelector('.vol-slider').addEventListener('input', (e) => {
      trackObj.volume = parseFloat(e.target.value); updateGains();
    });
    trackDiv.querySelector('.pan-slider').addEventListener('input', (e) => {
      trackObj.pan = parseFloat(e.target.value);
      if (trackObj.panNode) trackObj.panNode.pan.value = trackObj.pan;
    });

    const muteBtn = trackDiv.querySelector('.mute-btn');
    muteBtn.addEventListener('click', () => {
      trackObj.isMuted = !trackObj.isMuted;
      muteBtn.classList.toggle('active-mute', trackObj.isMuted);
      updateGains();
    });

    const soloBtn = trackDiv.querySelector('.solo-btn');
    soloBtn.addEventListener('click', () => {
      trackObj.isSolo = !trackObj.isSolo;
      soloBtn.classList.toggle('active-solo', trackObj.isSolo);
      updateGains();
    });
  }

  async function processAudioFile(file, trackObj) {
    const statusText = document.getElementById(`status-${trackObj.id}`);
    const globalScreen = document.getElementById('statusDisplay');
    
    const fileSizeMB = (file.size / (1024 * 1024)).toFixed(1);
    statusText.style.color = '#888';
    statusText.innerText = `Cargando: ${file.name} (${fileSizeMB}MB)...`;
    globalScreen.innerText = "PROCESANDO BLOB...";

    const blobUrl = URL.createObjectURL(file);

    try {
      const audioElement = new Audio();
      audioElement.src = blobUrl;

      await new Promise((resolve, reject) => {
        audioElement.onloadedmetadata = () => resolve();
        audioElement.onerror = () => reject(new Error("Formato/Códec no compatible en este navegador."));
      });

      statusText.innerText = "Decodificando PCM...";
      globalScreen.innerText = "DECODIFICANDO PCM...";

      const response = await fetch(blobUrl);
      const arrayBuffer = await response.arrayBuffer();

      const ctx = getAudioContext();

      if (!trackObj.gainNode) {
        trackObj.gainNode = ctx.createGain();
        trackObj.panNode = ctx.createStereoPanner();
        trackObj.gainNode.connect(trackObj.panNode);
        trackObj.panNode.connect(ctx.destination);
      }

      const decodedBuffer = await new Promise((resolve, reject) => {
        ctx.decodeAudioData(
          arrayBuffer,
          (buffer) => resolve(buffer),
          (err) => reject(new Error("Falla al convertir PCM."))
        );
      });

      trackObj.buffer = decodedBuffer;
      renderClip(trackObj.id, file.name, decodedBuffer.duration);
      globalScreen.innerText = "CARGA EXITOSA";

    } catch (err) {
      console.error(err);
      statusText.innerText = `ERR: ${err.message}`;
      statusText.style.color = 'var(--led-red)';
      globalScreen.innerText = "ERROR FORMATO";
    } finally {
      URL.revokeObjectURL(blobUrl);
    }
  }

  // Obtenemos todos los puntos de finalización de pistas para calcular el magnetismo
  function getSnapPoints(currentTrackId) {
    const points = [0]; // El inicio absoluto (0s) siempre es un punto de imán
    tracks.forEach(t => {
      if (t.id !== currentTrackId && t.buffer) {
        const endPx = (t.startTime + t.buffer.duration) * PIXELS_PER_SECOND;
        const startPx = t.startTime * PIXELS_PER_SECOND;
        points.push(endPx);
        points.push(startPx);
      }
    });
    return points;
  }

  function renderClip(trackId, name, duration) {
    const timeline = document.getElementById(`timeline-${trackId}`);
    Array.from(timeline.querySelectorAll('.audio-clip')).forEach(el => el.remove());

    const clip = document.createElement('div');
    clip.className = 'audio-clip';
    
    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.innerText = '✕';
    removeBtn.onclick = (e) => {
      e.stopPropagation();
      removeTrack(trackId);
    };

    clip.appendChild(removeBtn);
    clip.appendChild(document.createTextNode(`░ ${name}`));
    clip.style.width = `${duration * PIXELS_PER_SECOND}px`;
    clip.style.left = '0px';

    let isDragging = false;
    let startX = 0;
    let initialLeft = 0;

    // EVENTOS TÁCTILES Y DE RATÓN CON LÓGICA DE IMÁN
    const onStart = (clientX) => {
      isDragging = true;
      startX = clientX;
      initialLeft = parseFloat(clip.style.left) || 0;
    };

    const onMove = (clientX) => {
      if (!isDragging) return;
      let rawLeft = initialLeft + (clientX - startX);
      if (rawLeft < 0) rawLeft = 0;

      const maxLeft = TIMELINE_WIDTH - (duration * PIXELS_PER_SECOND);
      if (rawLeft > maxLeft) rawLeft = maxLeft;

      let finalLeft = rawLeft;
      let isSnapped = false;
      let snapPointPx = 0;

      // Lógica del imán
      if (isSnapEnabled) {
        const snapPoints = getSnapPoints(trackId);
        
        for (let pt of snapPoints) {
          // Evaluar si el principio de este clip se pega al final/inicio de otro
          if (Math.abs(rawLeft - pt) < SNAP_THRESHOLD_PX) {
            finalLeft = pt;
            isSnapped = true;
            snapPointPx = pt;
            break;
          }
        }
      }

      // Actualizar interfaz y línea de guía visual
      clip.style.left = `${finalLeft}px`;
      
      if (isSnapped) {
        clip.classList.add('snapped');
        snapGuide.style.display = 'block';
        // Posicionar línea vertical alineada con los controles
        snapGuide.style.left = `${snapPointPx + 140}px`; 
      } else {
        clip.classList.remove('snapped');
        snapGuide.style.display = 'none';
      }
      
      const trackObj = tracks.find(t => t.id === trackId);
      if (trackObj) trackObj.startTime = finalLeft / PIXELS_PER_SECOND;
    };

    const onEnd = () => {
      if (!isDragging) return;
      isDragging = false;
      clip.classList.remove('snapped');
      snapGuide.style.display = 'none';
    };

    // Touch
    clip.addEventListener('touchstart', (e) => {
      onStart(e.touches[0].clientX);
      e.stopPropagation();
    }, {passive: false});

    window.addEventListener('touchmove', (e) => {
      if (isDragging) onMove(e.touches[0].clientX);
    }, {passive: false});

    window.addEventListener('touchend', onEnd);

    // Mouse
    clip.addEventListener('mousedown', (e) => {
      onStart(e.clientX);
      e.stopPropagation();
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) onMove(e.clientX);
    });

    window.addEventListener('mouseup', onEnd);

    const statusText = document.getElementById(`status-${trackId}`);
    if (statusText) statusText.style.display = 'none';

    timeline.appendChild(clip);
  }

  function updateGains() {
    const hasSolo = tracks.some(t => t.isSolo);
    tracks.forEach(t => {
      if (!t.gainNode) return;
      let gainVal = t.volume;
      if (t.isMuted || (hasSolo && !t.isSolo)) gainVal = 0;
      t.gainNode.gain.value = gainVal;
    });
  }

  function removeTrack(id) {
    tracks = tracks.filter(t => t.id !== id);
    const elem = document.getElementById(`track-${id}`);
    if (elem) elem.remove();
    updateGains();
  }

  function togglePlay() {
    const ctx = getAudioContext();
    if (isPlaying) {
      activeSources.forEach(s => s.stop());
      activeSources = [];
      isPlaying = false;
      document.getElementById('statusDisplay').innerText = "STOP";
    } else {
      updateGains();
      tracks.forEach(t => {
        if (!t.buffer || !t.gainNode) return;
        const source = ctx.createBufferSource();
        source.buffer = t.buffer;
        source.connect(t.gainNode);
        source.start(ctx.currentTime + t.startTime);
        activeSources.push(source);
      });
      isPlaying = true;
      document.getElementById('statusDisplay').innerText = "PLAYING...";
    }
  }

  async function exportWav() {
    let maxEndTime = 0;
    tracks.forEach(t => {
      if (t.buffer) {
        const endTime = t.startTime + t.buffer.duration;
        if (endTime > maxEndTime) maxEndTime = endTime;
      }
    });

    if (maxEndTime === 0) return alert("Carga un archivo primero.");

    document.getElementById('statusDisplay').innerText = "RENDERING...";
    const targetSampleRate = parseInt(document.getElementById('sampleRateSelect').value);
    const bitDepth = document.getElementById('bitDepthSelect').value;
    const renderDuration = Math.min(maxEndTime, MAX_DURATION_SEC);
    
    const offlineCtx = new OfflineAudioContext(2, renderDuration * targetSampleRate, targetSampleRate);
    const hasSolo = tracks.some(t => t.isSolo);

    tracks.forEach(t => {
      if (!t.buffer) return;
      let activeVolume = t.volume;
      if (t.isMuted || (hasSolo && !t.isSolo)) activeVolume = 0;

      const source = offlineCtx.createBufferSource();
      const gain = offlineCtx.createGain();
      const pan = offlineCtx.createStereoPanner();

      source.buffer = t.buffer;
      gain.gain.value = activeVolume;
      pan.pan.value = t.pan;

      source.connect(gain);
      gain.connect(pan);
      pan.connect(offlineCtx.destination);
      source.start(t.startTime);
    });

    const renderedBuffer = await offlineCtx.startRendering();
    const wav = new wavefile.WaveFile();
    wav.fromScratch(2, targetSampleRate, bitDepth, [renderedBuffer.getChannelData(0), renderedBuffer.getChannelData(1)]);

    const blob = new Blob([wav.toBuffer()], { type: 'audio/wav' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `mezcla_master.wav`;
    a.click();

    document.getElementById('statusDisplay').innerText = "COMPLETADO";
  }
</script>
</body>
</html>
