<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Multitrack Workstation</title>
  <style>
    :root {
      --rack-bg: #1a1b1e;
      --panel-bg: #2b2d32;
      --panel-border: #3a3d45;
      --wood-side: #4a2810;
      --accent-gold: #d4af37;
      --led-red: #ff3b30;
      --led-yellow: #ffcc00;
      --screen-bg: #0d130e;
      --screen-text: #33ff55;
      --error-text: #ff3333;
    }
    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      background: #0f0f11;
      color: #e1e1e6;
      padding: 15px;
      user-select: none;
    }
    .console-frame {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--rack-bg);
      border: 4px solid var(--panel-border);
      border-left: 14px solid var(--wood-side);
      border-right: 14px solid var(--wood-side);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      padding: 15px;
    }
    .header-panel {
      background: linear-gradient(180deg, #32353c 0%, #222429 100%);
      border: 2px solid #111;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .display-screen {
      background: var(--screen-bg);
      border: 2px inset #111;
      color: var(--screen-text);
      padding: 6px 12px;
      font-family: monospace;
      font-size: 1rem;
      border-radius: 4px;
      text-shadow: 0 0 5px var(--screen-text);
      min-width: 200px;
      text-align: center;
    }
    .rack-btn {
      background: linear-gradient(180deg, #4c505c 0%, #2c2e35 100%);
      color: #fff;
      border: 2px solid #111;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.75rem;
    }
    .rack-btn.accent {
      background: linear-gradient(180deg, #b33939 0%, #841515 100%);
      color: #ffdae0;
    }
    select {
      background: #111;
      color: var(--accent-gold);
      border: 1px solid #444;
      padding: 5px;
      border-radius: 4px;
    }
    .ruler-container {
      margin-left: 250px;
      background: #111;
      height: 22px;
      border: 1px solid #333;
      position: relative;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .ruler-mark {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 1px solid #555;
      font-size: 9px;
      color: #aaa;
      padding-left: 2px;
    }
    .track-container { display: flex; flex-direction: column; gap: 10px; }
    .track-strip {
      background: linear-gradient(180deg, var(--panel-bg) 0%, #1f2024 100%);
      border: 2px solid #111;
      border-radius: 4px;
      display: grid;
      grid-template-columns: 230px 1fr 25px;
      gap: 10px;
      padding: 8px;
      align-items: center;
    }
    .track-controls {
      background: #191a1d;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn-led-group { display: flex; gap: 6px; }
    .led-btn {
      flex: 1;
      padding: 4px;
      font-size: 0.65rem;
      background: #222;
      color: #888;
      border: 1px solid #000;
      cursor: pointer;
    }
    .led-btn.active-mute { background: var(--led-red); color: #fff; }
    .led-btn.active-solo { background: var(--led-yellow); color: #000; font-weight: bold; }
    .track-timeline {
      position: relative;
      background: #0a0a0c;
      height: 75px;
      border: 2px inset #111;
      overflow: hidden;
    }
    .track-timeline.dragover { border-color: var(--accent-gold); background: #141714; }
    .audio-clip {
      position: absolute;
      top: 3px;
      height: 65px;
      background: linear-gradient(180deg, #2b580c 0%, #639a67 100%);
      border: 1px solid #a8df8e;
      border-radius: 3px;
      color: #fff;
      font-size: 0.7rem;
      padding: 4px;
      cursor: grab;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 10;
    }
    .drop-zone-text {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 28px;
      font-size: 0.75rem;
      color: #666;
      pointer-events: none;
      z-index: 1;
    }
    .error-log { color: var(--error-text); font-weight: bold; text-shadow: none; }
    .remove-btn { background: none; border: none; color: #666; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
    .remove-btn:hover { color: var(--led-red); }
    input[type="file"] { max-width: 140px; }
  </style>
  <script src="https://unpkg.com/wavefile"></script>
</head>
<body>

<div class="console-frame">
  <div class="header-panel">
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="rack-btn" id="addTrackBtn">+ Nueva Pista</button>
      <button class="rack-btn" id="playBtn">▶ / ❚❚ Play</button>
      <div class="display-screen" id="statusDisplay">SYSTEM READY</div>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
      <label>Rate:
        <select id="sampleRateSelect">
          <option value="48000">48000 Hz</option>
          <option value="44100">44100 Hz</option>
        </select>
      </label>

      <label>Depth:
        <select id="bitDepthSelect">
          <option value="16">16-Bit</option>
          <option value="24">24-Bit</option>
          <option value="32f">32-Bit Float</option>
        </select>
      </label>

      <button class="rack-btn accent" id="exportBtn">Export WAV</button>
    </div>
  </div>

  <div class="ruler-container" id="ruler"></div>
  <div class="track-container" id="trackContainer"></div>
</div>

<script>
  const MAX_MINUTES = 80;
  const MAX_DURATION_SEC = MAX_MINUTES * 60;
  const PIXELS_PER_SECOND = 0.25;

  let audioCtx = null;
  let tracks = [];
  let isPlaying = false;
  let activeSources = [];

  // Dibujar regla de 80 minutos
  const ruler = document.getElementById('ruler');
  for (let min = 0; min <= MAX_MINUTES; min += 10) {
    const mark = document.createElement('div');
    mark.className = 'ruler-mark';
    mark.style.left = `${(min * 60) * PIXELS_PER_SECOND}px`;
    mark.innerText = `${min}m`;
    ruler.appendChild(mark);
  }

  // Despertar AudioContext de forma síncrona en el primer clic
  function initAudioContext() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Forzar inicialización en cualquier interacción global para evitar bloqueos en iOS/Safari
  document.body.addEventListener('click', initAudioContext, { once: true });

  document.getElementById('addTrackBtn').addEventListener('click', addTrack);
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('exportBtn').addEventListener('click', exportWav);

  // Agregar la primera pista por defecto
  addTrack();

  function addTrack() {
    const trackId = Date.now();
    const trackDiv = document.createElement('div');
    trackDiv.className = 'track-strip';
    trackDiv.id = `track-${trackId}`;

    trackDiv.innerHTML = `
      <div class="track-controls">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="color:var(--accent-gold); font-size:0.75rem;">CH ${tracks.length + 1}</strong>
        </div>
        <!-- Botón de archivo nativo -->
        <input type="file" accept="audio/*" class="file-input" style="font-size:0.6rem; color:#fff;">
        
        <div class="btn-led-group" style="margin-top: 5px;">
          <button class="led-btn mute-btn">MUTE</button>
          <button class="led-btn solo-btn">SOLO</button>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:0.65rem; margin-top:5px;">
          <span>VOL</span>
          <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="1" style="width:110px;">
        </div>
        <div style="display:flex; justify-content:space-between; font-size:0.65rem;">
          <span>PAN</span>
          <input type="range" class="pan-slider" min="-1" max="1" step="0.01" value="0" style="width:110px;">
        </div>
      </div>

      <div class="track-timeline" id="timeline-${trackId}">
        <span class="drop-zone-text" id="status-${trackId}">Selecciona un audio en el botón izquierdo</span>
      </div>

      <button class="remove-btn" onclick="removeTrack(${trackId})">✕</button>
    `;

    document.getElementById('trackContainer').appendChild(trackDiv);

    const trackObj = {
      id: trackId,
      buffer: null,
      gainNode: null,
      panNode: null,
      volume: 1,
      pan: 0,
      startTime: 0,
      isMuted: false,
      isSolo: false
    };

    tracks.push(trackObj);

    // Event listeners de la pista
    const fileInput = trackDiv.querySelector('.file-input');
    const timeline = trackDiv.querySelector('.track-timeline');

    // 1. Carga por Botón (Input File)
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        processAudioFile(e.target.files[0], trackObj);
      }
    });

    // 2. Carga por Drag & Drop
    timeline.addEventListener('dragover', (e) => { 
      e.preventDefault(); 
      timeline.classList.add('dragover'); 
    });
    timeline.addEventListener('dragleave', () => {
      timeline.classList.remove('dragover');
    });
    timeline.addEventListener('drop', (e) => {
      e.preventDefault();
      timeline.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        processAudioFile(e.dataTransfer.files[0], trackObj);
      }
    });

    // Controles de volumen, paneo, mute, solo
    trackDiv.querySelector('.vol-slider').addEventListener('input', (e) => {
      trackObj.volume = parseFloat(e.target.value);
      updateGains();
    });
    trackDiv.querySelector('.pan-slider').addEventListener('input', (e) => {
      trackObj.pan = parseFloat(e.target.value);
      if (trackObj.panNode) trackObj.panNode.pan.value = trackObj.pan;
    });

    const muteBtn = trackDiv.querySelector('.mute-btn');
    muteBtn.addEventListener('click', () => {
      trackObj.isMuted = !trackObj.isMuted;
      muteBtn.classList.toggle('active-mute', trackObj.isMuted);
      updateGains();
    });

    const soloBtn = trackDiv.querySelector('.solo-btn');
    soloBtn.addEventListener('click', () => {
      trackObj.isSolo = !trackObj.isSolo;
      soloBtn.classList.toggle('active-solo', trackObj.isSolo);
      updateGains();
    });
  }

  // --- MOTOR DE CARGA BLINDADO ---
  async function processAudioFile(file, trackObj) {
    const statusText = document.getElementById(`status-${trackObj.id}`);
    const globalScreen = document.getElementById('statusDisplay');
    
    try {
      // Paso 1: Inicialización
      statusText.innerText = "[1/3] Preparando entorno...";
      statusText.classList.remove("error-log");
      
      const ctx = initAudioContext();
      if (!ctx) throw new Error("AudioContext no soportado en este navegador.");

      // Crear nodos si no existen
      if (!trackObj.gainNode) {
        trackObj.gainNode = ctx.createGain();
        trackObj.panNode = ctx.createStereoPanner();
        trackObj.gainNode.connect(trackObj.panNode);
        trackObj.panNode.connect(ctx.destination);
      }

      // Paso 2: Lectura
      statusText.innerText = `[2/3] Leyendo: ${file.name}...`;
      globalScreen.innerText = "READING MEMORY...";
      const arrayBuffer = await file.arrayBuffer();

      // Paso 3: Decodificación (Usamos callbacks explícitos para no romper iOS/Safari)
      statusText.innerText = "[3/3] Decodificando (puede tardar si es largo)...";
      globalScreen.innerText = "DECODING PCM...";

      const decodedData = await new Promise((resolve, reject) => {
        ctx.decodeAudioData(
          arrayBuffer,
          (buffer) => resolve(buffer),
          (error) => reject(new Error("Formato inválido o falta de RAM. " + (error ? error.message : "")))
        );
      });

      // Validación de 80 minutos
      if (decodedData.duration > MAX_DURATION_SEC) {
        throw new Error("El archivo excede el límite de 80 minutos.");
      }

      // Éxito
      trackObj.buffer = decodedData;
      renderClip(trackObj.id, file.name, decodedData.duration);
      globalScreen.innerText = "FILE LOADED OK";

    } catch (err) {
      console.error(err);
      statusText.innerText = `ERROR: ${err.message}`;
      statusText.classList.add("error-log");
      globalScreen.innerText = "SYSTEM ERROR";
    }
  }

  function renderClip(trackId, name, duration) {
    const timeline = document.getElementById(`timeline-${trackId}`);
    
    // Limpiar clíps anteriores, pero conservar el texto de estado por si acaso
    Array.from(timeline.querySelectorAll('.audio-clip')).forEach(el => el.remove());

    const clip = document.createElement('div');
    clip.className = 'audio-clip';
    clip.innerText = `░ ${name}`;
    clip.style.width = `${duration * PIXELS_PER_SECOND}px`;
    clip.style.left = '0px';

    let isDragging = false;
    let startX = 0;
    let initialLeft = 0;

    clip.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      initialLeft = parseFloat(clip.style.left) || 0;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      let newLeft = initialLeft + (e.clientX - startX);
      if (newLeft < 0) newLeft = 0;

      const maxLeft = MAX_DURATION_SEC * PIXELS_PER_SECOND - (duration * PIXELS_PER_SECOND);
      if (newLeft > maxLeft) newLeft = maxLeft;

      clip.style.left = `${newLeft}px`;
      
      const trackObj = tracks.find(t => t.id === trackId);
      if (trackObj) trackObj.startTime = newLeft / PIXELS_PER_SECOND;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });
    
    // Ocultar texto de fondo si hay audio
    const statusText = document.getElementById(`status-${trackId}`);
    if (statusText) statusText.style.display = 'none';

    timeline.appendChild(clip);
  }

  function updateGains() {
    const hasSolo = tracks.some(t => t.isSolo);
    tracks.forEach(t => {
      if (!t.gainNode) return;
      let gainVal = t.volume;
      if (t.isMuted || (hasSolo && !t.isSolo)) gainVal = 0;
      t.gainNode.gain.value = gainVal;
    });
  }

  function removeTrack(id) {
    tracks = tracks.filter(t => t.id !== id);
    const elem = document.getElementById(`track-${id}`);
    if (elem) elem.remove();
    updateGains();
  }

  function togglePlay() {
    const ctx = initAudioContext();

    if (isPlaying) {
      activeSources.forEach(s => s.stop());
      activeSources = [];
      isPlaying = false;
      document.getElementById('statusDisplay').innerText = "STOPPED";
    } else {
      updateGains();
      tracks.forEach(t => {
        if (!t.buffer || !t.gainNode) return;
        const source = ctx.createBufferSource();
        source.buffer = t.buffer;
        source.connect(t.gainNode);
        source.start(ctx.currentTime + t.startTime);
        activeSources.push(source);
      });
      isPlaying = true;
      document.getElementById('statusDisplay').innerText = "PLAYING...";
    }
  }

  async function exportWav() {
    let maxEndTime = 0;
    tracks.forEach(t => {
      if (t.buffer) {
        const endTime = t.startTime + t.buffer.duration;
        if (endTime > maxEndTime) maxEndTime = endTime;
      }
    });

    if (maxEndTime === 0) {
      alert("Carga al menos un archivo de audio válido.");
      return;
    }

    document.getElementById('statusDisplay').innerText = "RENDERING WAV...";

    const targetSampleRate = parseInt(document.getElementById('sampleRateSelect').value);
    const bitDepth = document.getElementById('bitDepthSelect').value;

    const renderDuration = Math.min(maxEndTime, MAX_DURATION_SEC);
    const offlineCtx = new OfflineAudioContext(2, renderDuration * targetSampleRate, targetSampleRate);
    const hasSolo = tracks.some(t => t.isSolo);

    tracks.forEach(t => {
      if (!t.buffer) return;

      let activeVolume = t.volume;
      if (t.isMuted || (hasSolo && !t.isSolo)) activeVolume = 0;

      const source = offlineCtx.createBufferSource();
      const gain = offlineCtx.createGain();
      const pan = offlineCtx.createStereoPanner();

      source.buffer = t.buffer;
      gain.gain.value = activeVolume;
      pan.pan.value = t.pan;

      source.connect(gain);
      gain.connect(pan);
      pan.connect(offlineCtx.destination);

      source.start(t.startTime);
    });

    const renderedBuffer = await offlineCtx.startRendering();
    const leftChannel = renderedBuffer.getChannelData(0);
    const rightChannel = renderedBuffer.getChannelData(1);

    const wav = new wavefile.WaveFile();
    wav.fromScratch(2, targetSampleRate, bitDepth, [leftChannel, rightChannel]);

    const blob = new Blob([wav.toBuffer()], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mezcla_master_${targetSampleRate}Hz_${bitDepth}bit.wav`;
    a.click();

    document.getElementById('statusDisplay').innerText = "EXPORT COMPLETE";
  }
</script>
</body>
</html>
