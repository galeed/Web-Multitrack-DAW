<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mobile Workstation - Fix Loading</title>
  <style>
    :root {
      --panel-bg: #2b2d32;
      --accent-gold: #d4af37;
      --led-red: #ff3b30;
      --led-yellow: #ffcc00;
      --screen-text: #33ff55;
      --track-height: 95px;
      --controls-width: 135px;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, monospace;
      background: #0f0f11;
      color: #e1e1e6;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    .header-panel {
      background: #1a1c20;
      border-bottom: 2px solid #000;
      padding: 8px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
    }
    .display-screen {
      background: #0d130e;
      color: var(--screen-text);
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      text-align: center;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid #222;
    }
    .rack-btn {
      background: #3a3d45;
      color: #fff;
      border: 1px solid #111;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.75rem;
      touch-action: manipulation;
    }
    .rack-btn.accent { background: #841515; }

    select {
      background: #111; color: var(--accent-gold);
      border: 1px solid #444; padding: 4px; font-size: 0.75rem;
    }

    .workspace {
      flex: 1;
      overflow: auto;
      position: relative;
      background: #141518;
      -webkit-overflow-scrolling: touch;
    }

    .ruler-wrapper {
      position: sticky;
      top: 0;
      left: var(--controls-width);
      z-index: 20;
      height: 20px;
      background: #111;
      border-bottom: 1px solid #333;
      width: max-content;
    }
    .ruler-container { position: relative; height: 100%; }
    .ruler-mark {
      position: absolute; top: 0; bottom: 0;
      border-left: 1px solid #555; font-size: 10px; color: #aaa; padding-left: 2px;
    }

    .track-strip {
      display: flex;
      width: max-content;
      border-bottom: 2px solid #000;
    }

    .track-controls {
      width: var(--controls-width);
      height: var(--track-height);
      position: sticky;
      left: 0;
      z-index: 10;
      background: var(--panel-bg);
      border-right: 2px solid #000;
      padding: 6px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .file-input {
      width: 100%;
      font-size: 0.65rem;
      color: #fff;
    }

    .btn-led-group { display: flex; gap: 4px; }
    .led-btn {
      flex: 1; padding: 4px 0; font-size: 0.65rem; background: #222; color: #888; border: 1px solid #000;
    }
    .led-btn.active-mute { background: var(--led-red); color: #fff; }
    .led-btn.active-solo { background: var(--led-yellow); color: #000; }

    .slider-row {
      display: flex; justify-content: space-between; align-items: center; font-size: 0.6rem;
    }
    input[type="range"] { width: 70px; }

    .track-timeline {
      position: relative;
      height: var(--track-height);
      background: #0a0a0c;
    }
    .drop-zone-text {
      position: absolute; top: 15px; left: 10px; right: 10px;
      font-size: 0.7rem; color: #888; pointer-events: none;
      word-break: break-all;
    }

    .audio-clip {
      position: absolute;
      top: 5px;
      height: 85px;
      background: linear-gradient(180deg, #2b580c 0%, #639a67 100%);
      border: 1px solid #a8df8e;
      border-radius: 4px;
      color: #fff;
      font-size: 0.7rem;
      padding: 4px;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
      touch-action: none;
      z-index: 5;
    }

    .remove-btn {
      position: absolute; right: 2px; top: 2px; background: rgba(0,0,0,0.6);
      border: none; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; z-index: 10;
    }
  </style>
  <script src="https://unpkg.com/wavefile"></script>
</head>
<body>

<div class="header-panel">
  <div class="header-row">
    <button class="rack-btn" id="addTrackBtn">+ Pista</button>
    <div class="display-screen" id="statusDisplay">SISTEMA LISTO</div>
    <button class="rack-btn" id="playBtn">▶ / ❚❚</button>
  </div>
  <div class="header-row">
    <select id="sampleRateSelect">
      <option value="48000">48kHz</option>
      <option value="44100">44.1kHz</option>
    </select>
    <select id="bitDepthSelect">
      <option value="16">16-Bit</option>
      <option value="24">24-Bit</option>
    </select>
    <button class="rack-btn accent" id="exportBtn">Exportar</button>
  </div>
</div>

<div class="workspace">
  <div class="ruler-wrapper">
    <div class="ruler-container" id="ruler"></div>
  </div>
  <div id="trackContainer"></div>
</div>

<script>
  const MAX_MINUTES = 80;
  const MAX_DURATION_SEC = MAX_MINUTES * 60;
  const PIXELS_PER_SECOND = 1.5; 
  const TIMELINE_WIDTH = MAX_DURATION_SEC * PIXELS_PER_SECOND;

  let audioCtx = null;
  let tracks = [];
  let isPlaying = false;
  let activeSources = [];

  const ruler = document.getElementById('ruler');
  ruler.style.width = `${TIMELINE_WIDTH}px`;
  for (let min = 0; min <= MAX_MINUTES; min += 1) {
    const mark = document.createElement('div');
    mark.className = 'ruler-mark';
    mark.style.left = `${(min * 60) * PIXELS_PER_SECOND}px`;
    if (min % 5 === 0) mark.innerText = `${min}m`;
    ruler.appendChild(mark);
  }

  function getAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  document.body.addEventListener('touchstart', getAudioContext, { once: true });
  document.body.addEventListener('click', getAudioContext, { once: true });

  document.getElementById('addTrackBtn').addEventListener('click', addTrack);
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('exportBtn').addEventListener('click', exportWav);

  addTrack();

  function addTrack() {
    const trackId = Date.now();
    const trackDiv = document.createElement('div');
    trackDiv.className = 'track-strip';
    trackDiv.id = `track-${trackId}`;

    trackDiv.innerHTML = `
      <div class="track-controls">
        <div style="color:var(--accent-gold); font-size:0.75rem; font-weight:bold; text-align:center;">
          CH ${tracks.length + 1}
        </div>
        <input type="file" accept="audio/*" class="file-input">
        
        <div class="btn-led-group">
          <button class="led-btn mute-btn">M</button>
          <button class="led-btn solo-btn">S</button>
        </div>
        <div class="slider-row">
          <span>V</span>
          <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="1">
        </div>
        <div class="slider-row">
          <span>P</span>
          <input type="range" class="pan-slider" min="-1" max="1" step="0.01" value="0">
        </div>
      </div>

      <div class="track-timeline" id="timeline-${trackId}" style="width: ${TIMELINE_WIDTH}px;">
        <span class="drop-zone-text" id="status-${trackId}">Selecciona un archivo de audio</span>
      </div>
    `;

    document.getElementById('trackContainer').appendChild(trackDiv);

    const trackObj = {
      id: trackId, buffer: null, gainNode: null, panNode: null, 
      volume: 1, pan: 0, startTime: 0, isMuted: false, isSolo: false
    };
    tracks.push(trackObj);

    const fileInput = trackDiv.querySelector('.file-input');
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        processAudioFile(e.target.files[0], trackObj);
      }
    });

    trackDiv.querySelector('.vol-slider').addEventListener('input', (e) => {
      trackObj.volume = parseFloat(e.target.value); updateGains();
    });
    trackDiv.querySelector('.pan-slider').addEventListener('input', (e) => {
      trackObj.pan = parseFloat(e.target.value);
      if (trackObj.panNode) trackObj.panNode.pan.value = trackObj.pan;
    });

    const muteBtn = trackDiv.querySelector('.mute-btn');
    muteBtn.addEventListener('click', () => {
      trackObj.isMuted = !trackObj.isMuted;
      muteBtn.classList.toggle('active-mute', trackObj.isMuted);
      updateGains();
    });

    const soloBtn = trackDiv.querySelector('.solo-btn');
    soloBtn.addEventListener('click', () => {
      trackObj.isSolo = !trackObj.isSolo;
      soloBtn.classList.toggle('active-solo', trackObj.isSolo);
      updateGains();
    });
  }

  // MOTOR DE LECTURA CON FILEREADER (SOPORTE COMPLETO WEBKIT / IOS)
  function processAudioFile(file, trackObj) {
    const statusText = document.getElementById(`status-${trackObj.id}`);
    const globalScreen = document.getElementById('statusDisplay');
    
    const fileSizeMB = (file.size / (1024 * 1024)).toFixed(1);
    statusText.style.color = '#888';
    statusText.innerText = `Leyendo: ${file.name} (${fileSizeMB}MB)...`;
    globalScreen.innerText = "LEYENDO ARCHIVO...";

    const reader = new FileReader();

    reader.onload = function(e) {
      statusText.innerText = "Decodificando audio en WebAudio...";
      globalScreen.innerText = "DECODIFICANDO PCM...";

      const ctx = getAudioContext();

      if (!trackObj.gainNode) {
        trackObj.gainNode = ctx.createGain();
        trackObj.panNode = ctx.createStereoPanner();
        trackObj.gainNode.connect(trackObj.panNode);
        trackObj.panNode.connect(ctx.destination);
      }

      // Decodificación con soporte explícito de Promesa y Callback
      const arrayBuffer = e.target.result;

      ctx.decodeAudioData(
        arrayBuffer,
        function(decodedBuffer) {
          trackObj.buffer = decodedBuffer;
          renderClip(trackObj.id, file.name, decodedBuffer.duration);
          globalScreen.innerText = "CARGA EXITOSA";
        },
        function(err) {
          console.error("Decode Error:", err);
          let errDetail = err ? (err.message || err.name) : "Códec no soportado";
          statusText.innerText = `ERR DECODE: ${errDetail}. (Safari no lee OGG o FLAC no nativos)`;
          statusText.style.color = 'var(--led-red)';
          globalScreen.innerText = "ERROR DECODE";
        }
      );
    };

    reader.onerror = function(err) {
      console.error("FileReader Error:", err);
      statusText.innerText = "ERR LECTURA: El navegador bloqueó el archivo local.";
      statusText.style.color = 'var(--led-red)';
      globalScreen.innerText = "ERROR LECTURA";
    };

    // Iniciar lectura del Blob local
    reader.readAsArrayBuffer(file);
  }

  function renderClip(trackId, name, duration) {
    const timeline = document.getElementById(`timeline-${trackId}`);
    Array.from(timeline.querySelectorAll('.audio-clip')).forEach(el => el.remove());

    const clip = document.createElement('div');
    clip.className = 'audio-clip';
    
    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.innerText = '✕';
    removeBtn.onclick = (e) => {
      e.stopPropagation();
      removeTrack(trackId);
    };

    clip.appendChild(removeBtn);
    clip.appendChild(document.createTextNode(`░ ${name}`));
    clip.style.width = `${duration * PIXELS_PER_SECOND}px`;
    clip.style.left = '0px';

    let isDragging = false;
    let startX = 0;
    let initialLeft = 0;

    clip.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX;
      initialLeft = parseFloat(clip.style.left) || 0;
      e.stopPropagation(); 
    }, {passive: false});

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      let newLeft = initialLeft + (e.touches[0].clientX - startX);
      if (newLeft < 0) newLeft = 0;

      const maxLeft = TIMELINE_WIDTH - (duration * PIXELS_PER_SECOND);
      if (newLeft > maxLeft) newLeft = maxLeft;

      clip.style.left = `${newLeft}px`;
      
      const trackObj = tracks.find(t => t.id === trackId);
      if (trackObj) trackObj.startTime = newLeft / PIXELS_PER_SECOND;
    }, {passive: false});

    window.addEventListener('touchend', () => { isDragging = false; });

    const statusText = document.getElementById(`status-${trackId}`);
    if (statusText) statusText.style.display = 'none';

    timeline.appendChild(clip);
  }

  function updateGains() {
    const hasSolo = tracks.some(t => t.isSolo);
    tracks.forEach(t => {
      if (!t.gainNode) return;
      let gainVal = t.volume;
      if (t.isMuted || (hasSolo && !t.isSolo)) gainVal = 0;
      t.gainNode.gain.value = gainVal;
    });
  }

  function removeTrack(id) {
    tracks = tracks.filter(t => t.id !== id);
    const elem = document.getElementById(`track-${id}`);
    if (elem) elem.remove();
    updateGains();
  }

  function togglePlay() {
    const ctx = getAudioContext();
    if (isPlaying) {
      activeSources.forEach(s => s.stop());
      activeSources = [];
      isPlaying = false;
      document.getElementById('statusDisplay').innerText = "STOP";
    } else {
      updateGains();
      tracks.forEach(t => {
        if (!t.buffer || !t.gainNode) return;
        const source = ctx.createBufferSource();
        source.buffer = t.buffer;
        source.connect(t.gainNode);
        source.start(ctx.currentTime + t.startTime);
        activeSources.push(source);
      });
      isPlaying = true;
      document.getElementById('statusDisplay').innerText = "PLAYING...";
    }
  }

  async function exportWav() {
    let maxEndTime = 0;
    tracks.forEach(t => {
      if (t.buffer) {
        const endTime = t.startTime + t.buffer.duration;
        if (endTime > maxEndTime) maxEndTime = endTime;
      }
    });

    if (maxEndTime === 0) return alert("Carga un archivo primero.");

    document.getElementById('statusDisplay').innerText = "RENDERING...";
    const targetSampleRate = parseInt(document.getElementById('sampleRateSelect').value);
    const bitDepth = document.getElementById('bitDepthSelect').value;
    const renderDuration = Math.min(maxEndTime, MAX_DURATION_SEC);
    
    const offlineCtx = new OfflineAudioContext(2, renderDuration * targetSampleRate, targetSampleRate);
    const hasSolo = tracks.some(t => t.isSolo);

    tracks.forEach(t => {
      if (!t.buffer) return;
      let activeVolume = t.volume;
      if (t.isMuted || (hasSolo && !t.isSolo)) activeVolume = 0;

      const source = offlineCtx.createBufferSource();
      const gain = offlineCtx.createGain();
      const pan = offlineCtx.createStereoPanner();

      source.buffer = t.buffer;
      gain.gain.value = activeVolume;
      pan.pan.value = t.pan;

      source.connect(gain);
      gain.connect(pan);
      pan.connect(offlineCtx.destination);
      source.start(t.startTime);
    });

    const renderedBuffer = await offlineCtx.startRendering();
    const wav = new wavefile.WaveFile();
    wav.fromScratch(2, targetSampleRate, bitDepth, [renderedBuffer.getChannelData(0), renderedBuffer.getChannelData(1)]);

    const blob = new Blob([wav.toBuffer()], { type: 'audio/wav' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `mezcla_master.wav`;
    a.click();

    document.getElementById('statusDisplay').innerText = "COMPLETADO";
  }
</script>
</body>
</html>
