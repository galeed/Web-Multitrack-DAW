<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Multitrack Workstation</title>
  <style>
    :root {
      --rack-bg: #1a1b1e;
      --panel-bg: #2b2d32;
      --panel-border: #3a3d45;
      --wood-side: #4a2810;
      --accent-gold: #d4af37;
      --led-red: #ff3b30;
      --led-yellow: #ffcc00;
      --led-green: #34c759;
      --screen-bg: #0d130e;
      --screen-text: #33ff55;
    }
    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      background: #0f0f11;
      color: #e1e1e6;
      padding: 20px;
      user-select: none;
    }
    .console-frame {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--rack-bg);
      border: 4px solid var(--panel-border);
      border-left: 16px solid var(--wood-side);
      border-right: 16px solid var(--wood-side);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      padding: 20px;
    }
    .header-panel {
      background: linear-gradient(180deg, #32353c 0%, #222429 100%);
      border: 2px solid #111;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .display-screen {
      background: var(--screen-bg);
      border: 3px inset #111;
      color: var(--screen-text);
      padding: 8px 15px;
      font-family: monospace;
      font-size: 1.1rem;
      border-radius: 4px;
      text-shadow: 0 0 5px var(--screen-text);
    }
    .rack-btn {
      background: linear-gradient(180deg, #4c505c 0%, #2c2e35 100%);
      color: #fff;
      border: 2px solid #111;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
      box-shadow: 0 3px 0 #111;
    }
    .rack-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #111;
    }
    .rack-btn.accent {
      background: linear-gradient(180deg, #b33939 0%, #841515 100%);
      color: #ffdae0;
    }
    select, input[type="file"] {
      background: #111;
      color: var(--accent-gold);
      border: 1px solid #444;
      padding: 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    /* Regla Global de 80 Minutos */
    .ruler-container {
      margin-left: 260px;
      background: #111;
      height: 26px;
      border: 1px solid #333;
      position: relative;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .ruler-mark {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 1px solid #555;
      font-size: 9px;
      color: #aaa;
      padding-left: 3px;
    }
    .track-container { display: flex; flex-direction: column; gap: 12px; }
    .track-strip {
      background: linear-gradient(180deg, var(--panel-bg) 0%, #1f2024 100%);
      border: 2px solid #111;
      border-radius: 4px;
      display: grid;
      grid-template-columns: 240px 1fr 20px;
      gap: 15px;
      padding: 10px;
      align-items: center;
    }
    .track-controls {
      background: #191a1d;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rotary-group { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
    .btn-led-group { display: flex; gap: 8px; }
    .led-btn {
      flex: 1;
      padding: 4px;
      font-size: 0.7rem;
      background: #222;
      color: #888;
      border: 1px solid #000;
      cursor: pointer;
    }
    .led-btn.active-mute { background: var(--led-red); color: #fff; text-shadow: 0 0 5px #fff; }
    .led-btn.active-solo { background: var(--led-yellow); color: #000; font-weight: bold; }
    
    /* Timeline de Pista */
    .track-timeline {
      position: relative;
      background: #0a0a0c;
      height: 80px;
      border: 2px inset #111;
      overflow: hidden;
    }
    .track-timeline.dragover {
      border-color: var(--accent-gold);
      background: #141714;
    }
    .audio-clip {
      position: absolute;
      top: 4px;
      height: 68px;
      background: linear-gradient(180deg, #2b580c 0%, #639a67 100%);
      border: 1px solid #a8df8e;
      border-radius: 3px;
      color: #fff;
      font-size: 0.75rem;
      padding: 4px;
      cursor: grab;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .drop-zone-text {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 30px;
      font-size: 0.75rem;
      color: #555;
      pointer-events: none;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #666;
      font-weight: bold;
      cursor: pointer;
    }
    .remove-btn:hover { color: var(--led-red); }
  </style>
  <script src="https://unpkg.com/wavefile"></script>
</head>
<body>

<div class="console-frame">
  <div class="header-panel">
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="rack-btn" id="addTrackBtn">+ Nueva Pista</button>
      <button class="rack-btn" id="playBtn">▶ / ❚❚ Play</button>
      <div class="display-screen" id="timeDisplay">00:00:00 / 80:00:00</div>
    </div>

    <div style="display:flex; gap:12px; align-items:center;">
      <label>Rate:
        <select id="sampleRateSelect">
          <option value="48000">48000 Hz</option>
          <option value="44100">44100 Hz</option>
        </select>
      </label>

      <label>Depth:
        <select id="bitDepthSelect">
          <option value="16">16-Bit PCM</option>
          <option value="24">24-Bit PCM</option>
          <option value="32f">32-Bit Float</option>
        </select>
      </label>

      <button class="rack-btn accent" id="exportBtn">REC / Export WAV</button>
    </div>
  </div>

  <!-- Regla Temporal (0 a 80 Minutos) -->
  <div class="ruler-container" id="ruler"></div>

  <!-- Pistas Multipista -->
  <div class="track-container" id="trackContainer"></div>
</div>

<script>
  const MAX_MINUTES = 80;
  const MAX_DURATION_SEC = MAX_MINUTES * 60; // 4800 segundos
  const PIXELS_PER_SECOND = 0.25; // 80 min ocupan 1200px de ancho aproximadamente

  let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let tracks = [];
  let isPlaying = false;
  let activeSources = [];

  const trackContainer = document.getElementById('trackContainer');

  // Inicializar regla de 80 minutos
  const ruler = document.getElementById('ruler');
  for (let min = 0; min <= MAX_MINUTES; min += 10) {
    const mark = document.createElement('div');
    mark.className = 'ruler-mark';
    mark.style.left = `${(min * 60) * PIXELS_PER_SECOND}px`;
    mark.innerText = `${min}m`;
    ruler.appendChild(mark);
  }

  document.getElementById('addTrackBtn').addEventListener('click', addTrack);
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('exportBtn').addEventListener('click', exportWav);

  // Añadir primera pista por defecto
  addTrack();

  function addTrack() {
    const trackId = Date.now();
    const trackDiv = document.createElement('div');
    trackDiv.className = 'track-strip';
    trackDiv.id = `track-${trackId}`;

    trackDiv.innerHTML = `
      <div class="track-controls">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="color:var(--accent-gold); font-size:0.8rem;">CH ${tracks.length + 1}</strong>
          <input type="file" accept="audio/*" class="file-input" style="width:110px; font-size:0.65rem;">
        </div>
        <div class="btn-led-group">
          <button class="led-btn mute-btn">MUTE</button>
          <button class="led-btn solo-btn">SOLO</button>
        </div>
        <div class="rotary-group">
          <span>VOL</span>
          <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="1" style="width:120px;">
        </div>
        <div class="rotary-group">
          <span>PAN</span>
          <input type="range" class="pan-slider" min="-1" max="1" step="0.01" value="0" style="width:120px;">
        </div>
      </div>

      <div class="track-timeline" id="timeline-${trackId}">
        <span class="drop-zone-text">Arrastra un archivo de audio aquí o usa el botón de carga</span>
      </div>

      <button class="remove-btn" onclick="removeTrack(${trackId})">✕</button>
    `;

    trackContainer.appendChild(trackDiv);

    const trackObj = {
      id: trackId,
      buffer: null,
      gainNode: audioCtx.createGain(),
      panNode: audioCtx.createStereoPanner(),
      volume: 1,
      pan: 0,
      startTime: 0,
      isMuted: false,
      isSolo: false
    };

    trackObj.gainNode.connect(trackObj.panNode);
    trackObj.panNode.connect(audioCtx.destination);

    const timeline = trackDiv.querySelector('.track-timeline');

    // Manejar carga mediante Input File
    const fileInput = trackDiv.querySelector('.file-input');
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) processAudioFile(e.target.files[0], trackObj);
    });

    // Manejar carga mediante Drag & Drop directo a la pista
    timeline.addEventListener('dragover', (e) => {
      e.preventDefault();
      timeline.classList.add('dragover');
    });
    timeline.addEventListener('dragleave', () => timeline.classList.remove('dragover'));
    timeline.addEventListener('drop', (e) => {
      e.preventDefault();
      timeline.classList.remove('dragover');
      if (e.dataTransfer.files[0]) processAudioFile(e.dataTransfer.files[0], trackObj);
    });

    // Controles de volumen/pan/mute/solo
    trackDiv.querySelector('.vol-slider').addEventListener('input', (e) => {
      trackObj.volume = parseFloat(e.target.value);
      updateGains();
    });
    trackDiv.querySelector('.pan-slider').addEventListener('input', (e) => {
      trackObj.pan = parseFloat(e.target.value);
      trackObj.panNode.pan.value = trackObj.pan;
    });

    const muteBtn = trackDiv.querySelector('.mute-btn');
    muteBtn.addEventListener('click', () => {
      trackObj.isMuted = !trackObj.isMuted;
      muteBtn.classList.toggle('active-mute', trackObj.isMuted);
      updateGains();
    });

    const soloBtn = trackDiv.querySelector('.solo-btn');
    soloBtn.addEventListener('click', () => {
      trackObj.isSolo = !trackObj.isSolo;
      soloBtn.classList.toggle('active-solo', trackObj.isSolo);
      updateGains();
    });

    tracks.push(trackObj);
  }

  async function processAudioFile(file, trackObj) {
    try {
      const arrayBuffer = await file.arrayBuffer();
      const decodedData = await audioCtx.decodeAudioData(arrayBuffer);

      if (decodedData.duration > MAX_DURATION_SEC) {
        alert("El archivo excede el límite máximo de 80 minutos.");
        return;
      }

      trackObj.buffer = decodedData;
      renderClip(trackObj.id, file.name, decodedData.duration);
    } catch (err) {
      alert("Error al procesar el archivo de audio.");
    }
  }

  function renderClip(trackId, name, duration) {
    const timeline = document.getElementById(`timeline-${trackId}`);
    timeline.innerHTML = '';

    const clip = document.createElement('div');
    clip.className = 'audio-clip';
    clip.innerText = `░ ${name}`;
    clip.style.width = `${duration * PIXELS_PER_SECOND}px`;
    clip.style.left = '0px';

    let isDragging = false;
    let startX = 0;
    let initialLeft = 0;

    clip.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      initialLeft = parseFloat(clip.style.left) || 0;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      let newLeft = initialLeft + deltaX;
      if (newLeft < 0) newLeft = 0;

      // Límite visual marcado por la regla de 80 minutos
      const maxLeft = MAX_DURATION_SEC * PIXELS_PER_SECOND - (duration * PIXELS_PER_SECOND);
      if (newLeft > maxLeft) newLeft = maxLeft;

      clip.style.left = `${newLeft}px`;
      
      const trackObj = tracks.find(t => t.id === trackId);
      if (trackObj) {
        trackObj.startTime = newLeft / PIXELS_PER_SECOND;
      }
    });

    window.addEventListener('mouseup', () => { isDragging = false; });
    timeline.appendChild(clip);
  }

  function updateGains() {
    const hasSolo = tracks.some(t => t.isSolo);
    tracks.forEach(t => {
      let gainVal = t.volume;
      if (t.isMuted || (hasSolo && !t.isSolo)) gainVal = 0;
      t.gainNode.gain.value = gainVal;
    });
  }

  function removeTrack(id) {
    tracks = tracks.filter(t => t.id !== id);
    document.getElementById(`track-${id}`).remove();
    updateGains();
  }

  function togglePlay() {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (isPlaying) {
      activeSources.forEach(s => s.stop());
      activeSources = [];
      isPlaying = false;
    } else {
      updateGains();
      tracks.forEach(t => {
        if (!t.buffer) return;
        const source = audioCtx.createBufferSource();
        source.buffer = t.buffer;
        source.connect(t.gainNode);
        source.start(audioCtx.currentTime + t.startTime);
        activeSources.push(source);
      });
      isPlaying = true;
    }
  }

  async function exportWav() {
    const targetSampleRate = parseInt(document.getElementById('sampleRateSelect').value);
    const bitDepth = document.getElementById('bitDepthSelect').value;

    let maxEndTime = 0;
    tracks.forEach(t => {
      if (t.buffer) {
        const endTime = t.startTime + t.buffer.duration;
        if (endTime > maxEndTime) maxEndTime = endTime;
      }
    });

    if (maxEndTime === 0) {
      alert("Carga al menos una pista de audio para realizar la exportación.");
      return;
    }

    const renderDuration = Math.min(maxEndTime, MAX_DURATION_SEC);
    const offlineCtx = new OfflineAudioContext(2, renderDuration * targetSampleRate, targetSampleRate);
    const hasSolo = tracks.some(t => t.isSolo);

    tracks.forEach(t => {
      if (!t.buffer) return;

      let activeVolume = t.volume;
      if (t.isMuted || (hasSolo && !t.isSolo)) activeVolume = 0;

      const source = offlineCtx.createBufferSource();
      const gain = offlineCtx.createGain();
      const pan = offlineCtx.createStereoPanner();

      source.buffer = t.buffer;
      gain.gain.value = activeVolume;
      pan.pan.value = t.pan;

      source.connect(gain);
      gain.connect(pan);
      pan.connect(offlineCtx.destination);

      source.start(t.startTime);
    });

    const renderedBuffer = await offlineCtx.startRendering();
    const leftChannel = renderedBuffer.getChannelData(0);
    const rightChannel = renderedBuffer.getChannelData(1);

    const wav = new wavefile.WaveFile();
    wav.fromScratch(2, targetSampleRate, bitDepth, [leftChannel, rightChannel]);

    const blob = new Blob([wav.toBuffer()], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mezcla_master_${targetSampleRate}Hz_${bitDepth}bit.wav`;
    a.click();
  }
</script>
</body>
</html>
