<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Multitrack DAW</title>
  <style>
    :root {
      --bg: #121214;
      --panel: #1e1e24;
      --accent: #ff4757;
      --text: #e1e1e6;
      --track-bg: #2a2a32;
      --clip-bg: #4a69bd;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--panel);
      padding: 15px;
      border-radius: 8px;
    }
    button, select, input {
      background: #32323e;
      color: var(--text);
      border: 1px solid #444452;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #3e3e4d; }
    button.active-mute { background: #e74c3c !important; color: white; }
    button.active-solo { background: #f1c40f !important; color: black; }
    
    .track-list { display: flex; flex-direction: column; gap: 10px; }
    .track {
      background: var(--track-bg);
      padding: 12px;
      border-radius: 6px;
      display: grid;
      grid-template-columns: 240px 1fr 80px;
      align-items: center;
      gap: 15px;
    }
    .track-controls { display: flex; flex-direction: column; gap: 8px; }
    .btn-group { display: flex; gap: 6px; }
    
    .timeline {
      position: relative;
      background: #18181c;
      height: 80px;
      border: 1px dashed #444;
      border-radius: 4px;
      overflow: hidden;
    }
    .audio-clip {
      position: absolute;
      top: 5px;
      height: 70px;
      background: var(--clip-bg);
      border-radius: 4px;
      color: white;
      font-size: 0.8rem;
      padding: 4px 8px;
      cursor: grab;
      user-select: none;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .audio-clip:active { cursor: grabbing; opacity: 0.8; }
  </style>
  <script src="https://unpkg.com/wavefile"></script>
</head>
<body>

  <h1>Web Multitrack Studio</h1>

  <div class="controls">
    <button id="addTrackBtn">+ Añadir Pista</button>
    <button id="playBtn">Play / Pause</button>
    
    <label>Sample Rate:
      <select id="sampleRateSelect">
        <option value="48000">48000 Hz</option>
        <option value="44100">44100 Hz</option>
      </select>
    </label>

    <label>Bit Depth:
      <select id="bitDepthSelect">
        <option value="16">16-bit PCM</option>
        <option value="24">24-bit PCM</option>
        <option value="32f">32-bit Float</option>
      </select>
    </label>

    <button id="exportBtn" style="background: var(--accent);">Exportar Mezcla</button>
  </div>

  <div class="track-list" id="trackContainer"></div>

<script>
  const MAX_DURATION_SEC = 80 * 60; // 80 minutos
  const PIXELS_PER_SECOND = 10; // Escala visual de la línea de tiempo
  let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let tracks = [];
  let isPlaying = false;
  let activeSources = [];

  const trackContainer = document.getElementById('trackContainer');

  document.getElementById('addTrackBtn').addEventListener('click', addTrack);
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('exportBtn').addEventListener('click', exportWav);

  function addTrack() {
    const trackId = Date.now();
    const trackDiv = document.createElement('div');
    trackDiv.className = 'track';
    trackDiv.id = `track-${trackId}`;

    trackDiv.innerHTML = `
      <div class="track-controls">
        <strong>Pista ${tracks.length + 1}</strong>
        <input type="file" accept="audio/*" class="file-input">
        <div class="btn-group">
          <button class="mute-btn">Mute</button>
          <button class="solo-btn">Solo</button>
        </div>
        <label>Vol: <input type="range" class="vol-slider" min="0" max="1" step="0.01" value="1"></label>
        <label>Pan: <input type="range" class="pan-slider" min="-1" max="1" step="0.01" value="0"></label>
      </div>
      <div class="timeline" id="timeline-${trackId}"></div>
      <button onclick="removeTrack(${trackId})">Eliminar</button>
    `;

    trackContainer.appendChild(trackDiv);

    const trackObj = {
      id: trackId,
      buffer: null,
      gainNode: audioCtx.createGain(),
      panNode: audioCtx.createStereoPanner(),
      volume: 1,
      pan: 0,
      startTime: 0, // Posición en la línea de tiempo (en segundos)
      isMuted: false,
      isSolo: false
    };

    trackObj.gainNode.connect(trackObj.panNode);
    trackObj.panNode.connect(audioCtx.destination);

    // Selección de archivo
    const fileInput = trackDiv.querySelector('.file-input');
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const arrayBuffer = await file.arrayBuffer();
      const decodedData = await audioCtx.decodeAudioData(arrayBuffer);

      if (decodedData.duration > MAX_DURATION_SEC) {
        alert("El archivo excede el límite permitido de 80 minutos.");
        return;
      }

      trackObj.buffer = decodedData;
      renderClip(trackId, file.name, decodedData.duration);
    });

    // Controles de volumen y pan
    trackDiv.querySelector('.vol-slider').addEventListener('input', (e) => {
      trackObj.volume = parseFloat(e.target.value);
      updateGainNodes();
    });

    trackDiv.querySelector('.pan-slider').addEventListener('input', (e) => {
      trackObj.pan = parseFloat(e.target.value);
      trackObj.panNode.pan.value = trackObj.pan;
    });

    // Botones Mute y Solo
    const muteBtn = trackDiv.querySelector('.mute-btn');
    muteBtn.addEventListener('click', () => {
      trackObj.isMuted = !trackObj.isMuted;
      muteBtn.classList.toggle('active-mute', trackObj.isMuted);
      updateGainNodes();
    });

    const soloBtn = trackDiv.querySelector('.solo-btn');
    soloBtn.addEventListener('click', () => {
      trackObj.isSolo = !trackObj.isSolo;
      soloBtn.classList.toggle('active-solo', trackObj.isSolo);
      updateGainNodes();
    });

    tracks.push(trackObj);
  }

  function renderClip(trackId, name, duration) {
    const timeline = document.getElementById(`timeline-${trackId}`);
    timeline.innerHTML = '';

    const clip = document.createElement('div');
    clip.className = 'audio-clip';
    clip.innerText = name;
    clip.style.width = `${duration * PIXELS_PER_SECOND}px`;
    clip.style.left = '0px';

    // Eventos para arrastrar el clip (desplazamiento temporal)
    let isDragging = false;
    let startX = 0;
    let initialLeft = 0;

    clip.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      initialLeft = parseFloat(clip.style.left) || 0;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - startX;
      let newLeft = initialLeft + deltaX;
      if (newLeft < 0) newLeft = 0;

      clip.style.left = `${newLeft}px`;
      
      const trackObj = tracks.find(t => t.id === trackId);
      if (trackObj) {
        trackObj.startTime = newLeft / PIXELS_PER_SECOND;
      }
    });

    window.addEventListener('mouseup', () => { isDragging = false; });
    timeline.appendChild(clip);
  }

  function updateGainNodes() {
    const hasSolo = tracks.some(t => t.isSolo);

    tracks.forEach(t => {
      let activeGain = t.volume;

      if (t.isMuted) {
        activeGain = 0;
      } else if (hasSolo && !t.isSolo) {
        activeGain = 0;
      }

      t.gainNode.gain.value = activeGain;
    });
  }

  function removeTrack(id) {
    tracks = tracks.filter(t => t.id !== id);
    document.getElementById(`track-${id}`).remove();
    updateGainNodes();
  }

  function togglePlay() {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (isPlaying) {
      activeSources.forEach(s => s.stop());
      activeSources = [];
      isPlaying = false;
    } else {
      updateGainNodes();
      tracks.forEach(t => {
        if (!t.buffer) return;
        const source = audioCtx.createBufferSource();
        source.buffer = t.buffer;
        source.connect(t.gainNode);
        
        // Inicia el audio respetando el offset configurado en el timeline
        source.start(audioCtx.currentTime + t.startTime);
        activeSources.push(source);
      });
      isPlaying = true;
    }
  }

  async function exportWav() {
    const targetSampleRate = parseInt(document.getElementById('sampleRateSelect').value);
    const bitDepth = document.getElementById('bitDepthSelect').value;

    let maxEndTime = 0;
    tracks.forEach(t => {
      if (t.buffer) {
        const endTime = t.startTime + t.buffer.duration;
        if (endTime > maxEndTime) maxEndTime = endTime;
      }
    });

    if (maxEndTime === 0) {
      alert("Carga al menos un archivo de audio para exportar.");
      return;
    }

    const renderDuration = Math.min(maxEndTime, MAX_DURATION_SEC);
    const offlineCtx = new OfflineAudioContext(2, renderDuration * targetSampleRate, targetSampleRate);

    const hasSolo = tracks.some(t => t.isSolo);

    tracks.forEach(t => {
      if (!t.buffer) return;

      let activeVolume = t.volume;
      if (t.isMuted || (hasSolo && !t.isSolo)) {
        activeVolume = 0;
      }

      const source = offlineCtx.createBufferSource();
      const gain = offlineCtx.createGain();
      const pan = offlineCtx.createStereoPanner();

      source.buffer = t.buffer;
      gain.gain.value = activeVolume;
      pan.pan.value = t.pan;

      source.connect(gain);
      gain.connect(pan);
      pan.connect(offlineCtx.destination);

      source.start(t.startTime);
    });

    const renderedBuffer = await offlineCtx.startRendering();
    const leftChannel = renderedBuffer.getChannelData(0);
    const rightChannel = renderedBuffer.getChannelData(1);

    const wav = new wavefile.WaveFile();
    wav.fromScratch(2, targetSampleRate, bitDepth, [leftChannel, rightChannel]);

    const blob = new Blob([wav.toBuffer()], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mezcla_${targetSampleRate}Hz_${bitDepth}bit.wav`;
    a.click();
  }
</script>
</body>
</html>
